  <text x="703" y="269" fill="#4b5563" font-size="16">noVNC desktop</text>
  <circle cx="687" cy="296" r="4" fill="#2563eb"/>
  <text x="703" y="301" fill="#4b5563" font-size="16">ufw</text>
  <circle cx="687" cy="328" r="4" fill="#2563eb"/>
