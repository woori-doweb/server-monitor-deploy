<VirtualHost *:80>
    ServerAdmin admin@app.example.com
    ServerName monitor.example.com

    <Location />
        <RequireAny>
            Require ip 127.0.0.1
            Require ip ::1
            Require ip 198.51.100.10
        </RequireAny>
    </Location>

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =monitor.example.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
