# Apache mod_status -- Netdata monitoring (internal port, local access only)
# Separate from VHosts to avoid SPA RewriteRule interference

Listen 127.0.0.1:8401

<VirtualHost 127.0.0.1:8401>
    <Location "/server-status">
        SetHandler server-status
        Require local
    </Location>
</VirtualHost>

# ExtendedStatus for detailed metrics
ExtendedStatus On
