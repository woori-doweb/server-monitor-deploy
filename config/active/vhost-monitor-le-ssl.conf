<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin admin@app.example.com
    ServerName monitor.example.com

    # -- IP restriction --
    <Location />
        <RequireAny>
            Require ip 127.0.0.1
            Require ip ::1
            Require ip 198.51.100.10
        </RequireAny>
    </Location>

    # -- Cockpit font path fix (doubled /cockpit/cockpit/ path) --
    AliasMatch "^/cockpit/cockpit/@[^/]+/.*/assets/fonts/(.*)" "/usr/share/cockpit/static/fonts/$1"
    <Directory /usr/share/cockpit/static/fonts>
        Require all granted
    </Directory>

    # -- Netdata (/netdata/) --
    ProxyPass /netdata/ http://127.0.0.1:19999/ connectiontimeout=5 timeout=30
    ProxyPassReverse /netdata/ http://127.0.0.1:19999/

    <Location /netdata/>
        AuthType Basic
        AuthName "Server Monitor"
        AuthUserFile /etc/httpd/.htpasswd-monitor
        <RequireAll>
            <RequireAny>
                Require ip 127.0.0.1
                Require ip ::1
                Require ip 198.51.100.10
            </RequireAny>
            Require valid-user
        </RequireAll>
    </Location>

    # -- Cockpit (/cockpit/) --
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/cockpit/(.*) ws://127.0.0.1:9090/cockpit/$1 [P,L]
    ProxyPreserveHost On
    ProxyPass /cockpit/ http://127.0.0.1:9090/cockpit/ connectiontimeout=5 timeout=30
    ProxyPassReverse /cockpit/ http://127.0.0.1:9090/cockpit/

    <Location /cockpit/>
        <RequireAny>
            Require ip 127.0.0.1
            Require ip ::1
            Require ip 198.51.100.10
        </RequireAny>
    </Location>

    # -- Uptime Kuma (root, WebSocket) --
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{REQUEST_URI} !^/netdata/ [NC]
    RewriteCond %{REQUEST_URI} !^/cockpit/ [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:3001/$1 [P,L]

    ProxyPass /netdata/ !
    ProxyPass /cockpit/ !
    ProxyPass / http://127.0.0.1:3001/ connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog /home/monitor/logs/monitor-error.log
    CustomLog /home/monitor/logs/monitor-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/monitor.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/monitor.example.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
